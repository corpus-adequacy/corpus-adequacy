name: contained-hosted-publication

on:
  workflow_dispatch:
    inputs:
      candidate_revision:
        description: Immutable candidate revision (40-hex)
        required: true
        type: string
      runner_revision:
        description: Generic runner revision (40-hex)
        required: true
        type: string
      image_digest:
        description: Candidate/toolchain image digest B (sha256:64hex)
        required: true
        type: string
      packet_release_tag:
        description: Release tag whose assets carry the owner-authorized packet
        required: true
        type: string
      packet_manifest_sha256:
        description: SHA-256 of the packet manifest release asset (64-hex)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: contained-hosted-publication
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  OPERATOR_EXECUTION_PROFILE: contained-oci-v0
  MAX_ARTIFACT_BYTES: "5242880"
  ARTIFACT_RETENTION_DAYS: "14"

jobs:
  hosted-contained:
    # Pinned, not ubuntu-latest: PREPARE (contained-hosted-prepare) runs on the same image, and
    # the driver's toolchain equality refuses if the image store or platform moved between them.
    runs-on: ubuntu-24.04
    # Worst case: 300 s materialize deadline + 9 x 120 s candidate invocations (baseline plus
    # eight authorized mutation steps) = 1380 s = 23 min; the other 7 min cover checkout,
    # Python setup, the packet fetch and the uploads.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.runner_revision }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Manifest first, digest before parse, then each listed asset individually into a fresh
      # directory that does not exist in R's tree; pins are copied from the checkout.
      - name: Fetch hosted packet
        shell: bash
        env:
          PACKET_RELEASE_TAG: ${{ inputs.packet_release_tag }}
          PACKET_MANIFEST_SHA256: ${{ inputs.packet_manifest_sha256 }}
        run: python measurements/hosted_packet.py fetch --repository "$GITHUB_REPOSITORY" --tag "$PACKET_RELEASE_TAG" --manifest-sha256 "$PACKET_MANIFEST_SHA256" --workspace-root "$GITHUB_WORKSPACE" --dest hosted-packet
      # The gate binds the manifest digest again itself and requires GITHUB_SHA ==
      # GITHUB_WORKFLOW_SHA == runner_revision from the runner's own environment.
      - name: Gate hosted publication
        id: gate
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
          RUNNER_REVISION: ${{ inputs.runner_revision }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          PACKET_MANIFEST_SHA256: ${{ inputs.packet_manifest_sha256 }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python measurements/contained_hosted_publication.py gate --candidate-revision "$CANDIDATE_REVISION" --runner-revision "$RUNNER_REVISION" --image-digest "$IMAGE_DIGEST" --packet-manifest-sha256 "$PACKET_MANIFEST_SHA256" --operator-profile "$OPERATOR_EXECUTION_PROFILE" --max-artifact-bytes "$MAX_ARTIFACT_BYTES" --out artifacts --workspace-root "$GITHUB_WORKSPACE" --packet-root hosted-packet --authorize authorize.v0.json --prepare prepare.v1.json --pins-dir pins --rerun-log artifacts/rerun-evidence.jsonl
      - name: Upload setup
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: setup
          path: artifacts/setup-status.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload effective-envelope
        # Fail-closed upload authorization, not a cleanliness claim: the collection is published
        # only when the gate step itself succeeded. Quarantine is a filesystem move and can fail;
        # if it does, the gate exits nonzero and this step never runs, so permitted members
        # cannot reach the artifact even when sanitization did not complete. The gate exits 0
        # only on a publish decision; a withheld or unavailable run exits 3, so this step
        # does not run for it either. The setup,
        # candidate and rerun diagnostics stay always-on so a refusal remains observable.
        if: steps.gate.outcome == 'success' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: effective-envelope
          # The collection directory is the authoritative artifact: its index plus every
          # addressed member. A re-serialized aggregate cannot stand in for those bytes, so the
          # whole directory is uploaded rather than one derived file.
          path: artifacts/effective-envelope-collection.v0/
          retention-days: 14
          if-no-files-found: error
      - name: Upload candidate-result
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-result
          path: artifacts/candidate-result.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload rerun-evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rerun-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rerun-evidence.jsonl
          retention-days: 14
          if-no-files-found: error
