name: pages

on:
  push:
    branches: [main]
    paths:
      - measurements/**
      - scripts/render_publication_page.py
      - scripts/publication_handoff.py
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/pages.yml
      - site/**
  pull_request:
    paths:
      - measurements/**
      - scripts/render_publication_page.py
      - scripts/publication_handoff.py
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/pages.yml
      - site/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Render publication page
        shell: bash
        run: python3 scripts/render_publication_page.py --root . --out site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
