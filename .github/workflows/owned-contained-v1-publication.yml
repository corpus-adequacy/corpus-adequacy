name: owned-contained-v1-publication

on:
  workflow_dispatch:
    inputs:
      candidate_revision:
        required: true
        type: string
      runner_revision:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      packet_release_tag:
        required: true
        type: string
      packet_manifest_sha256:
        required: true
        type: string

permissions:
  contents: read
  # Only for the attest step: mint the OIDC token and persist the attestation (#187).
  id-token: write
  attestations: write

concurrency:
  group: owned-contained-v1-publication
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  owned-contained:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.runner_revision }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Fetch owned packet
        shell: bash
        env:
          PACKET_RELEASE_TAG: ${{ inputs.packet_release_tag }}
          PACKET_MANIFEST_SHA256: ${{ inputs.packet_manifest_sha256 }}
        run: python measurements/owned_contained_v1_hosted.py fetch --repository "$GITHUB_REPOSITORY" --tag "$PACKET_RELEASE_TAG" --manifest-sha256 "$PACKET_MANIFEST_SHA256"
      - name: Gate owned publication
        id: gate
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
          RUNNER_REVISION: ${{ inputs.runner_revision }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          PACKET_MANIFEST_SHA256: ${{ inputs.packet_manifest_sha256 }}
        run: python measurements/owned_contained_v1_hosted.py gate --candidate-revision "$CANDIDATE_REVISION" --runner-revision "$RUNNER_REVISION" --image-digest "$IMAGE_DIGEST" --packet-manifest-sha256 "$PACKET_MANIFEST_SHA256" --out owned-contained-v1-artifacts
      # Seals whatever the gate left on the upload surface, report included, on every gate
      # outcome. Identity is read from the runner's own environment, as in the gate.
      - name: Seal owned attempt statement
        id: seal
        if: always() && !cancelled()
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
          RUNNER_REVISION: ${{ inputs.runner_revision }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          PACKET_RELEASE_TAG: ${{ inputs.packet_release_tag }}
          PACKET_MANIFEST_SHA256: ${{ inputs.packet_manifest_sha256 }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python measurements/owned_contained_v1_hosted.py seal --candidate-revision "$CANDIDATE_REVISION" --runner-revision "$RUNNER_REVISION" --image-digest "$IMAGE_DIGEST" --packet-release-tag "$PACKET_RELEASE_TAG" --packet-manifest-sha256 "$PACKET_MANIFEST_SHA256" --gate-outcome "$GATE_OUTCOME" --out owned-contained-v1-artifacts
      - name: Upload setup
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-contained-v1-setup
          path: owned-contained-v1-artifacts/setup-status.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload verified collection
        if: steps.gate.outcome == 'success' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-contained-v1-effective-envelope
          path: owned-contained-v1-artifacts/effective-envelope-collection.v0/
          retention-days: 14
          if-no-files-found: error
      - name: Upload report
        if: steps.gate.outcome == 'success' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-contained-v1-report
          path: owned-contained-v1-artifacts/report.v0.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload candidate result
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-contained-v1-candidate-result
          path: owned-contained-v1-artifacts/candidate-result.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload rerun evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-contained-v1-rerun-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: owned-contained-v1-artifacts/rerun-evidence.jsonl
          retention-days: 14
          if-no-files-found: error
      - name: Upload withheld diagnostic package
        if: always() && !cancelled() && steps.gate.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-contained-v1-withheld-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: owned-contained-v1-artifacts/withheld-diagnostic-package.v0/
          retention-days: 14
          if-no-files-found: error
      - name: Upload owned attempt statement
        if: always() && !cancelled() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-contained-v1-attempt-statement-${{ github.run_id }}-${{ github.run_attempt }}
          path: owned-contained-v1-artifacts/attempt-statement.v0/
          retention-days: 14
          if-no-files-found: error
      - name: Attest owned attempt statement
        if: always() && !cancelled() && steps.seal.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: owned-contained-v1-artifacts/attempt-statement.v0/SHA256SUMS
          predicate-type: https://github.com/corpus-adequacy/corpus-adequacy/attestations/hosted-attempt/v0
          predicate-path: owned-contained-v1-artifacts/attempt-statement.v0/hosted-attempt-predicate.v0.json
          show-summary: true
